[project]
name = "fhir-bridge"
version = "0.1.0"
description = "FHIR Bud: ingestion pipeline + retrieval-grounded backend for FHIR R4"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "openai>=1.30",
    "anthropic>=0.49",
    "tqdm>=4.66",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.0",
    "pyjwt>=2.10",
    "bcrypt>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
